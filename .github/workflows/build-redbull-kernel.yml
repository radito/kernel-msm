name: Build Redbull kernel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Kernel commit, branch, or tag to build
        required: true
        type: string
        default: 7b0944645172
      build_device_trees:
        description: Build Google DTBs and DTBO images (requires vendor/qcom DTS sources)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - android-msm-redbull-4.19-android14-qpr3

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc \
            bison \
            ccache \
            clang \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync

      - name: Install DTBO image tool
        if: inputs.build_device_trees == true
        run: |
          set -euo pipefail
          libufdt="$RUNNER_TEMP/libufdt"
          git init "$libufdt"
          git -C "$libufdt" remote add origin https://android.googlesource.com/platform/system/libufdt
          git -C "$libufdt" fetch --depth=1 origin \
            131ee2db53ad7d9d4756555567894b01107cb26e
          git -C "$libufdt" checkout --detach FETCH_HEAD
          install -m 0755 "$libufdt/utils/src/mkdtboimg.py" "$RUNNER_TEMP/mkdtboimg.py"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-redbull-ccache-${{ hashFiles('Makefile', 'Kconfig', 'arch/arm64/configs/redbull_defconfig', 'build.config.redbull*') }}
          restore-keys: |
            ${{ runner.os }}-redbull-ccache-

      - name: Configure kernel
        run: |
          set -euo pipefail
          echo "Building source ref: ${{ inputs.source_ref || github.sha }}"
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            redbull_defconfig

      - name: Build kernel, device trees, and modules
        run: |
          set -euo pipefail
          if [ "${{ inputs.source_ref || github.sha }}" = "7b0944645172" ] || \
             [ "${{ inputs.source_ref || github.sha }}" = "baseline-redbull-4.19.278" ]; then
            perl -0pi -e 's/^\s*#include <media\/cam_sensor\.h>\s*\n//m' \
              drivers/input/misc/vd6281/vd6281_module.c
          fi
          ccache --max-size=2G
          make -j"$(nproc)" O="$GITHUB_WORKSPACE/out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' \
            Image Image.lz4 modules 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          if [ "${{ inputs.build_device_trees }}" = "true" ]; then
            test -e arch/arm64/boot/dts/google/qcom-base/lito-v2.dts || {
              echo 'Missing arch/arm64/boot/dts/vendor/qcom DTS sources.' >&2
              echo 'The tracked google/qcom-base symlink points to that absent directory.' >&2
              exit 1
            }
            make -j"$(nproc)" O="$GITHUB_WORKSPACE/out" ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
              CC='ccache clang' \
              dtbs dtbo.img dtbo_redfin.img dtbo_bramble.img dtbo_barbet.img \
              2>&1 | tee -a "$GITHUB_WORKSPACE/out/build.log"
          fi

      - name: Collect build outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          for output in \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.lz4 \
            out/arch/arm64/boot/dtbo*.img \
            out/System.map \
            out/.config \
            out/build.log; do
            for file in $output; do
              if [ -f "$file" ]; then
                cp -f "$file" artifact/
              fi
            done
          done
          if [ -d out/arch/arm64/boot/dts ]; then
            mkdir -p artifact/dts
            rsync -a --include='*.dtb' --include='*.dtbo' --exclude='*' \
              out/arch/arm64/boot/dts/ artifact/dts/
          fi
          if [ -d out ] && find out -name '*.ko' -print -quit | grep -q .; then
            mkdir -p artifact/modules
            find out -name '*.ko' -exec cp --parents '{}' artifact/modules/ ';'
          fi
          printf 'commit=%s\n' "$GITHUB_SHA" > artifact/build-info.txt
          printf 'runner=%s\n' "$RUNNER_OS" >> artifact/build-info.txt
          printf 'config=redbull_defconfig\n' >> artifact/build-info.txt

      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbull-kernel-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14